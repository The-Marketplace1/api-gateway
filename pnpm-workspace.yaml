packages:
  - artifacts/*
  - scripts/*
  - lib/*
  - services/*

allowBuilds:
  esbuild: true
autoInstallPeers: false

# 1. Change "catalog:" to "catalogs:"
catalogs:
  # 2. Add "default:" to specify the default catalog name
  default:
    '@types/node': ^22.15.0
    'tsx': ^4.21.0       # Fixed missing opening quote
    'zod': ^3.25.76      # Fixed missing opening quote

overrides:
  esbuild: 0.27.3

