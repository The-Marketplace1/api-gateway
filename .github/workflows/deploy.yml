name: Deploy

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: marketplace-api-gateway
  ECS_CLUSTER: marketplace-production
  ECS_SERVICE: api-gateway
  CONTAINER_NAME: api-gateway

jobs:
  deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    environment: production

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # ─────────────────────────────
      # AWS Credentials (OIDC)
      # ─────────────────────────────
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ─────────────────────────────
      # Login to Amazon ECR
      # ─────────────────────────────
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ─────────────────────────────
      # Generate image tag safely
      # ─────────────────────────────
      - id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${GITHUB_SHA}"
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "image=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:$TAG" >> $GITHUB_OUTPUT

      # ─────────────────────────────
      # Setup Docker builder
      # ─────────────────────────────
      - uses: docker/setup-buildx-action@v3

      # ─────────────────────────────
      # Build & Push Docker image
      # ─────────────────────────────
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ─────────────────────────────
      # Get ECS task definition
      # ─────────────────────────────
      - run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_SERVICE }} \
            --query taskDefinition \
            > task-definition.json

      # ─────────────────────────────
      # Inject new image into task definition
      # ─────────────────────────────
      - id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.meta.outputs.image }}

      # ─────────────────────────────
      # Deploy to ECS
      # ─────────────────────────────
      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      # ─────────────────────────────
      # Post-deploy health check
      # ─────────────────────────────
      - name: Health check after deploy
        run: |
          sleep 20
          curl -sf "${{ secrets.GATEWAY_HEALTH_URL }}/api/healthz" \
            || (echo "❌ Health check failed after deploy" && exit 1)
